name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Package Kove.app
        run: ./build.sh release

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: Kove.app
          path: build/Kove.app
          if-no-files-found: error
